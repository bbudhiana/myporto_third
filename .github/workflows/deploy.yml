name: Deploy to VPS

on:
  push:
    branches:
      - main # Otomatis deploy setiap ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_ENV: ${{ secrets.APP_ENV }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "APP_ENV='${APP_ENV}' DB_DATABASE='${DB_DATABASE}' DB_USERNAME='${DB_USERNAME}' DB_PASSWORD='${DB_PASSWORD}' DB_HOST='${DB_HOST}' REPO_TOKEN='${REPO_TOKEN}' ADMIN_EMAIL='${ADMIN_EMAIL}' ADMIN_PASSWORD='${ADMIN_PASSWORD}' bash -s" <<'EOF'
          set -euo pipefail
          umask 0002

          export PATH=$PATH:/home/baban/.nvm/versions/node/v26.11.1/bin

          APP_PATH="/var/www/html/bana.indoez.com"
          REPO_URL="https://x-access-token:${REPO_TOKEN}@github.com/bbudhiana/myporto_third.git"
          FIRST_DEPLOY_MARKER="${APP_PATH}/storage/app/.demo_seeded"
          GIT_TERMINAL_PROMPT=0

          # User proses PHP (FrankenPHP) yang harus bisa menulis ke storage/.
          PHP_WORKER_USER="$(ps -eo user,comm | awk '/frankenphp/ && !/awk/ {print $1; exit}')"
          PHP_WORKER_USER="${PHP_WORKER_USER:-caddy}"

          ensure_storage_writable() {
            mkdir -p "${APP_PATH}/storage/app/public/uploads" "${APP_PATH}/storage/framework/cache/data" \
                     "${APP_PATH}/storage/framework/views" "${APP_PATH}/storage/framework/sessions" \
                     "${APP_PATH}/storage/framework/cache/locks" "${APP_PATH}/storage/logs" \
                     "${APP_PATH}/bootstrap/cache"
            # chgrp tanpa sudo: user deploy (baban) adalah anggota group caddy.
            chgrp -R "${PHP_WORKER_USER}" "${APP_PATH}/storage" "${APP_PATH}/bootstrap/cache" 2>/dev/null || true
            chmod -R g+rwX "${APP_PATH}/storage" "${APP_PATH}/bootstrap/cache" 2>/dev/null || true
            find "${APP_PATH}/storage" "${APP_PATH}/bootstrap/cache" -type d -exec chmod g+s {} + 2>/dev/null || true
          }

          ensure_storage_writable

          if sudo -n -u "${PHP_WORKER_USER}" test -w "${APP_PATH}/storage/app/public/uploads" 2>/dev/null; then
            echo "OK: worker PHP (${PHP_WORKER_USER}) bisa menulis ke storage"
          else
            echo "PERINGATAN: worker PHP (${PHP_WORKER_USER}) belum bisa menulis ke storage."
            echo "Jalankan manual: sudo chgrp -R ${PHP_WORKER_USER} ${APP_PATH}/storage ${APP_PATH}/bootstrap/cache"
          fi

          if [ ! -d "${APP_PATH}" ]; then
            mkdir -p "${APP_PATH}"
          fi

          if [ -n "$(ls -A "${APP_PATH}" 2>/dev/null)" ] && [ ! -d "${APP_PATH}/.git" ]; then
            rm -rf "${APP_PATH}/.git"
          fi

          if [ ! -d "${APP_PATH}/.git" ]; then
            rm -rf "${APP_PATH:?}"/* "${APP_PATH:?}"/.[!.]* "${APP_PATH:?}"/..?* 2>/dev/null || true
            git clone --branch main --single-branch "${REPO_URL}" "${APP_PATH}"
          fi

          cd "${APP_PATH}"
          git remote set-url origin "${REPO_URL}"
          git fetch origin main --depth=1
          git reset --hard origin/main

          if [ ! -f .env ]; then
            cp .env.example .env
            # APP_KEY harus unik per server, jangan memakai nilai dari repo.
            php artisan key:generate --force
          fi

          php artisan down || true
          # Selalu lifting maintenance mode, walau script gagal di tengah.
          trap 'php artisan up || true' EXIT

          php -r '
          $path = ".env";
          $values = [
              "APP_ENV" => getenv("APP_ENV") ?: "production",
              "APP_DEBUG" => "false",
              "APP_URL" => "https://bana.indoez.com",
              "DB_CONNECTION" => "mariadb",
              "DB_HOST" => getenv("DB_HOST") ?: "127.0.0.1",
              "DB_PORT" => "3306",
              "DB_DATABASE" => getenv("DB_DATABASE") ?: "bbudhiana_site",
              "DB_USERNAME" => getenv("DB_USERNAME") ?: "bana",
              "DB_PASSWORD" => getenv("DB_PASSWORD") ?: "",
              "CACHE_STORE" => "file",
              "QUEUE_CONNECTION" => "database",
              "SESSION_DRIVER" => "database",
          ];

          // Kredensial admin hanya ditulis bila secret GitHub tersedia.
          foreach (["ADMIN_EMAIL" => getenv("ADMIN_EMAIL"), "ADMIN_PASSWORD" => getenv("ADMIN_PASSWORD")] as $key => $value) {
              if (! empty($value)) {
                  $values[$key] = $value;
              }
          }

          $lines = file_exists($path) ? file($path, FILE_IGNORE_NEW_LINES) : [];
          $map = [];
          foreach ($lines as $line) {
              if (str_contains($line, "=") && ! str_starts_with(trim($line), "#")) {
                  [$key, $value] = explode("=", $line, 2);
                  $map[$key] = $value;
              }
          }

          foreach ($values as $key => $value) {
              $map[$key] = $value;
          }

          $content = "";
          foreach ($map as $key => $value) {
              $content .= $key . "=" . $value . PHP_EOL;
          }

          file_put_contents($path, $content);
          '

          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm install --legacy-peer-deps
          npm run build

          php artisan migrate --force
          php artisan storage:link || true
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Berkas hasil deploy (compiled view, cache) harus tetap group-writable.
          ensure_storage_writable

          if [ ! -f "${FIRST_DEPLOY_MARKER}" ]; then
            php artisan db:seed --class=Database\\Seeders\\Tables\\UsersSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\MediaSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\ProfilesSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\ExperiencesSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\SkillGroupsSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\SkillsSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\ProjectsSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\ProjectSkillSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\ProjectMediaSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\SiteSettingsSeeder --force
            php artisan db:seed --class=Database\\Seeders\\Tables\\SocialLinksSeeder --force

            mkdir -p "$(dirname "${FIRST_DEPLOY_MARKER}")"
            touch "${FIRST_DEPLOY_MARKER}"
          fi

          php artisan queue:restart || true
          php artisan up || true
          /home/baban/restart_caddy_services.sh
          EOF